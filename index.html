<style>
@font-face { font-family: "Kanit"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/kanit-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Kanit"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/kanit-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Kanit"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/kanit-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Kanit"; font-style: italic; font-weight: 800; font-display: swap; src: url(fonts/kanit-latin-800-italic.woff2) format("woff2"); }
@font-face { font-family: "Yellowtail"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/yellowtail-latin-400-normal.woff2) format("woff2"); }
:root {
  color-scheme: dark;
  /* Night sky over Vice Beach */
  --night: #1a0b36;
  --night-2: #221045;
  --dusk: #2e1660;
  --line: #43257f;
  --foam: #fbf3ff;
  --haze: #c3b0e6;
  --haze-2: #9581bf;
  /* Neon */
  --flamingo: #ff3d8b;
  --aqua: #22e4d3;
  --sunset: #ffb447;
  --sun-top: #ffc65c;
  /* Pillars: each section of the site keeps its own color */
  --p-search: var(--aqua);
  --p-discover: var(--sunset);
  --p-meta: var(--flamingo);
  --tier-s: #ff3d8b; --tier-a: #22e4d3; --tier-b: #ffb447; --tier-c: #8f7cc0;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  --display: "Kanit", system-ui, sans-serif;
  --body: "Kanit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --script: "Yellowtail", "Brush Script MT", cursive;
  --wrap: 1180px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body {
  margin: 0; background: var(--night); color: var(--foam);
  font: 400 17px/1.6 var(--body); font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--aqua); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--foam); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--aqua); color: var(--night); padding: 8px 14px; border-radius: 8px; z-index: 99; }
.skip:focus { left: 12px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.2rem, 5.4vw, 4rem); font-weight: 800; font-style: italic; }
h2 { font-size: clamp(1.45rem, 2.6vw, 1.9rem); font-weight: 800; font-style: italic; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0 0 1em; }
.muted { color: var(--haze); }
.small { font-size: .88rem; }

/* ---------- Header ---------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(26, 11, 54, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; height: 68px; }
.logo { display: flex; align-items: center; flex: none; text-decoration: none; }
.wordmark { /* sunset-filled type, cut by horizon stripes */
  font: italic 800 2.1rem/1 var(--display); letter-spacing: .03em; padding: 4px .14em 4px 0; white-space: nowrap;
  background:
    linear-gradient(180deg, transparent 0 57%, var(--night) 57% 62%, transparent 62% 70%, var(--night) 70% 74%, transparent 74%),
    linear-gradient(180deg, var(--sun-top) 18%, var(--sunset) 42%, var(--flamingo) 78%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.logo:hover .wordmark { opacity: .85; }
.hsearch { flex: 1; max-width: 540px; position: relative; }
.hsearch input {
  width: 100%; height: 44px; border-radius: 999px; padding: 0 48px 0 46px; font-size: .97rem;
  border: 2px solid transparent;
  background: linear-gradient(var(--night-2), var(--night-2)) padding-box, linear-gradient(90deg, var(--flamingo), var(--sunset) 50%, var(--aqua)) border-box;
  transition: box-shadow .2s;
}
.hsearch input::placeholder { color: var(--haze); }
.hsearch input:focus { outline: none; box-shadow: 0 0 0 4px rgba(255, 61, 139, .18), 0 0 28px rgba(34, 228, 211, .28); }
.hsearch .ico { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--aqua); pointer-events: none; }
.hsearch kbd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 500 .75rem var(--body); color: var(--haze); background: var(--dusk); border-radius: 6px; padding: 2px 8px; }
.pillars { display: flex; gap: 4px; margin-left: auto; }
.pillars a { display: flex; align-items: center; gap: 8px; color: var(--haze); text-decoration: none; font-weight: 500; padding: 8px 14px; border-radius: 999px; }
.pillars a:hover { color: var(--foam); background: var(--night-2); }
.pillars a[aria-current="page"] { color: var(--foam); background: var(--dusk); }
.pillars a i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pillars svg { display: none; }

/* ---------- Home ---------- */
.status-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; padding-top: 22px; padding-bottom: 0; font-size: .88rem; color: var(--haze-2); }
.hnews { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0 32px; }
.lead { grid-row: span 3; padding: 22px 24px; border-radius: var(--r-lg); background: linear-gradient(160deg, #3a1462, var(--night-2) 70%); border: 1px solid var(--line); display: flex; flex-direction: column; }
.lead .src { margin-top: auto; }
.lead h3 { font-size: 1.55rem; font-style: italic; font-weight: 800; margin: 6px 0 10px; line-height: 1.15; }
.lead h3 a, .feed a { color: var(--foam); text-decoration: none; }
.lead h3 a:hover, .feed a:hover { color: var(--aqua); }
.lead p { color: var(--haze); margin: 0 0 10px; }
.nk { display: flex; gap: 10px; font-size: .8rem; color: var(--haze-2); }
.feed { padding: 14px 0; border-top: 1px solid var(--line); }
.hnews > .feed:nth-child(2), .hnews > .feed:nth-child(3) { border-top: 0; padding-top: 4px; }
.feed a { display: block; font-weight: 500; line-height: 1.35; margin-top: 3px; }
.src { font-size: .82rem; color: var(--haze-2); margin-top: 4px; }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.cat { background: var(--night-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 18px 8px; }
.cat-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.cat-h h3 { font: italic 800 1.25rem/1.1 var(--display); }
.cat-h h3 a { color: var(--foam); text-decoration: none; }
.cat-h h3 a:hover { color: var(--flamingo); }
.cat-h > a { font-size: .9rem; }
.mrows { list-style: none; margin: 0; padding: 0; }
.mrows a { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); color: var(--foam); text-decoration: none; }
.mrows li:first-child a { border-top: 0; }
.mrows b { display: block; font-weight: 500; line-height: 1.25; }
.mrows small { color: var(--haze-2); font-size: .82rem; }
.mrows .sc { font: italic 800 1.1rem/1 var(--display); color: var(--t); }
.mrows .sc.thin { color: var(--haze-2); font-size: .9rem; font-style: normal; font-weight: 400; }
.mrows a:hover b { color: var(--flamingo); }
.lists.three { grid-template-columns: repeat(3, 1fr); }
.lists.three .lcard { grid-column: auto; }

/* ---------- Sections ---------- */
.block { padding: 56px 0 8px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.sec-h p { color: var(--haze); margin: 0; }
.sec-h a { white-space: nowrap; }
.page-h { padding: 44px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.page-h h1 { font-size: clamp(2rem, 4.4vw, 3rem); }
.page-h .lede { color: var(--haze); max-width: 62ch; margin: 12px 0 0; }
.page-h.p-search h1 { color: var(--p-search); }
.page-h.p-discover h1 { color: var(--p-discover); }
.page-h.p-meta h1 { color: var(--p-meta); }
.crumbs { font-size: .9rem; color: var(--haze-2); margin-bottom: 10px; }
.crumbs a { color: var(--haze); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--haze); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .92rem; }
.chip:hover { color: var(--foam); border-color: var(--haze-2); }
.chip[aria-pressed="true"] { background: var(--foam); color: var(--night); border-color: var(--foam); font-weight: 500; }
.chip .n { opacity: .65; margin-left: 4px; }

/* ---------- Search page ---------- */
.sbar { position: relative; margin-top: 18px; max-width: 760px; }
.sbar input { width: 100%; height: 60px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--night-2); padding: 0 20px 0 52px; font-size: 1.2rem; }
.sbar input:focus { outline: none; border-color: var(--aqua); }
.sbar .ico { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--aqua); }
.sres { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.hits { list-style: none; margin: 0; padding: 0; }
.hit { padding: 18px 0; border-bottom: 1px solid var(--line); }
.hit:first-child { padding-top: 4px; }
.hit .kind { font-size: .82rem; font-weight: 500; color: var(--k); display: inline-flex; align-items: center; gap: 6px; }
.hit .kind::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--k); }
.hit h3 { margin: 4px 0 6px; font-size: 1.2rem; }
.hit h3 a { color: var(--foam); text-decoration: none; }
.hit h3 a:hover { color: var(--k); }
.hit p { color: var(--haze); margin: 0 0 6px; max-width: 72ch; }
.hit .where { font-size: .86rem; color: var(--haze-2); }
mark { background: rgba(34, 228, 211, .22); color: var(--foam); border-radius: 3px; padding: 0 2px; }
.k-guide { --k: var(--aqua); } .k-list { --k: var(--sunset); } .k-meta { --k: var(--flamingo); } .k-news { --k: #b9a2ff; } .k-article { --k: #8ff0a4; }
.side { position: sticky; top: 92px; background: var(--night-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; }
.side h3 { font-size: 1rem; margin-bottom: 10px; }
.side .outs a { display: block; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; }
.side .outs a:first-child { border-top: 0; }
.answer-tile { background: linear-gradient(135deg, rgba(255, 61, 139, .16), rgba(255, 180, 71, .1)); border: 1px solid rgba(255, 61, 139, .45); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 18px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.answer-tile .tl { grid-row: span 2; }
.answer-tile h3 a { color: var(--foam); }
.answer-tile p { margin: 0; color: var(--haze); font-size: .94rem; }
.empty { padding: 28px; border: 1px dashed var(--line); border-radius: var(--r-lg); color: var(--haze); }
.empty h3 { color: var(--foam); margin-bottom: 8px; }

/* ---------- Discover ---------- */
.lists { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; }
.lcard { grid-column: span 2; display: flex; flex-direction: column; background: var(--night-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; color: var(--foam); text-decoration: none; position: relative; overflow: hidden; }
.lcard:hover { border-color: var(--sunset); color: var(--foam); }
.lcard.big { grid-column: span 4; grid-row: span 2; background: linear-gradient(160deg, #3a1462 0%, var(--night-2) 60%); }
.lcard.big h3 { font-size: 1.7rem; font-style: italic; font-weight: 800; }
.lcard .lk { color: var(--sunset); font-size: .86rem; font-weight: 500; margin-bottom: 8px; }
.lcard h3 { margin-bottom: 8px; }
.lcard p { color: var(--haze); font-size: .95rem; }
.lcard ol { margin: 4px 0 0; padding-left: 22px; color: var(--haze); }
.lcard ol li { padding: 3px 0; }
.lcard ol li::marker { color: var(--sunset); font-weight: 700; }
.lcard .more { margin-top: auto; padding-top: 12px; color: var(--sunset); font-weight: 500; }
.entries { list-style: none; margin: 0; padding: 0; counter-reset: e; max-width: 820px; }
.entry { display: grid; grid-template-columns: 52px 1fr; gap: 4px 16px; padding: 20px 0; border-bottom: 1px solid var(--line); counter-increment: e; }
.entry .num { grid-row: span 3; font: italic 800 2rem/1 var(--display); color: var(--sunset); }
.entry .num::before { content: counter(e); }
.entry h3 { font-size: 1.2rem; }
.entry p { margin: 4px 0; color: var(--haze); }
.entry .where { font-size: .86rem; color: var(--haze-2); }
.entry .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .9rem; color: var(--foam); margin-top: 4px; }
.entry .facts b { color: var(--haze-2); font-weight: 400; margin-right: 4px; }
.check { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--sunset); background: transparent; cursor: pointer; grid-row: span 3; display: grid; place-items: center; margin-top: 2px; }
.check svg { width: 18px; height: 18px; opacity: 0; color: var(--night); }
.entry.done .check { background: var(--sunset); }
.entry.done .check svg { opacity: 1; }
.entry.done h3 { text-decoration: line-through; text-decoration-color: var(--sunset); color: var(--haze); }
.progress { display: flex; align-items: center; gap: 14px; margin: 0 0 8px; max-width: 820px; }
.progress .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--dusk); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sunset), var(--flamingo)); transition: width .3s; }
.tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 28px; }
.tip { padding: 16px 0; border-top: 1px solid var(--line); }
.tip h3 { font-size: 1.02rem; margin-bottom: 6px; }
.tip p { color: var(--haze); font-size: .94rem; margin: 0 0 6px; }

/* ---------- Meta: tier board ---------- */
.mtabs { display: flex; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
.mtabs a { text-decoration: none; color: var(--haze); padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line); font-weight: 500; }
.mtabs a:hover { color: var(--foam); border-color: var(--haze-2); }
.mtabs a[aria-current="page"] { background: var(--flamingo); border-color: var(--flamingo); color: var(--night); }
.meta-lay { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 32px; align-items: start; }
.board { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); }
.trow { display: grid; grid-template-columns: 78px 1fr; min-height: 92px; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.tl { display: grid; place-items: center; font: italic 800 2.2rem/1 var(--display); color: var(--night); background: var(--t); }
.tl.sm { width: 52px; height: 52px; border-radius: 12px; font-size: 1.6rem; }
.tl.xs { width: 30px; height: 30px; border-radius: 8px; font-size: 1rem; display: inline-grid; }
.tl.none { background: var(--dusk); color: var(--haze); }
.titems { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; background: var(--night-2); align-content: center; }
.tile { display: flex; flex-direction: column; justify-content: center; min-width: 150px; max-width: 220px; padding: 10px 14px; border-radius: var(--r-md); background: var(--dusk); border: 2px solid transparent; color: var(--foam); text-decoration: none; }
.tile:hover { border-color: var(--t); color: var(--foam); }
.tile[aria-current="true"] { border-color: var(--t); background: #3b1d73; }
.tile b { font-weight: 700; line-height: 1.25; }
.tile small { color: var(--haze); font-size: .82rem; }
.tile .sc { font-weight: 700; color: var(--t); }
.trow .none-msg { color: var(--haze-2); font-size: .9rem; align-self: center; padding-left: 4px; }
.detail { position: sticky; top: 92px; background: var(--night-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; }
.detail .dh { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
.detail h2 { font-size: 1.6rem; }
.detail .sub { color: var(--haze); font-size: .92rem; }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: var(--r-md); overflow: hidden; margin: 16px 0; }
.scores div { background: var(--dusk); padding: 10px 12px; }
.scores b { display: block; font: italic 800 1.5rem/1.1 var(--display); }
.scores span { color: var(--haze); font-size: .82rem; }
.scores .thin b { color: var(--haze-2); }
.vote { display: flex; gap: 8px; margin: 0 0 18px; }
.vote button { flex: 1; padding: 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 500; }
.vote button:hover { border-color: var(--haze-2); }
.vote button[aria-pressed="true"].up { background: var(--aqua); border-color: var(--aqua); color: var(--night); }
.vote button[aria-pressed="true"].down { background: var(--flamingo); border-color: var(--flamingo); color: var(--night); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0 0 16px; font-size: .95rem; }
dl.facts dt { color: var(--haze-2); }
dl.facts dd { margin: 0; }
.srcs { list-style: none; padding: 0; margin: 8px 0 0; }
.srcs li { padding: 12px 0; border-top: 1px solid var(--line); font-size: .93rem; }
.srcs .who { display: flex; justify-content: space-between; gap: 10px; }
.srcs .rk { color: var(--flamingo); font-weight: 700; white-space: nowrap; }
.srcs q { display: block; color: var(--haze); margin-top: 4px; }
.vid { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 99px; background: rgba(255, 61, 139, .18); color: #ff8fbb; margin-left: 6px; vertical-align: 1px; }


/* ---------- News + articles ---------- */
.news { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 36px; }
.ncard { padding: 18px 0; border-top: 1px solid var(--line); }
.ncard .nk { display: flex; gap: 12px; flex-wrap: wrap; font-size: .84rem; color: var(--haze-2); margin-bottom: 4px; }
.status { font-weight: 500; }
.status.confirmed { color: var(--aqua); } .status.reported { color: var(--sunset); } .status.disputed { color: var(--flamingo); }
.ncard h3 { margin-bottom: 6px; }
.ncard p { color: var(--haze); font-size: .95rem; margin-bottom: 6px; }
.ncard .src { font-size: .88rem; color: var(--haze-2); }
.posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.pcard { display: block; padding: 22px; border-radius: var(--r-lg); background: var(--night-2); border: 1px solid var(--line); color: var(--foam); text-decoration: none; }
.pcard:hover { border-color: #8ff0a4; color: var(--foam); }
.pcard .pk { color: #8ff0a4; font-size: .86rem; margin-bottom: 8px; display: block; }
.pcard p { color: var(--haze); font-size: .94rem; margin: 8px 0 0; }
.prose { max-width: 72ch; }
.prose h2 { margin: 36px 0 12px; font-size: 1.5rem; }

}
function highlight(text, terms) {
  const frag = document.createDocumentFragment();
  const words = terms.flatMap(x => [x.t, ...x.alts]).filter(w => w.length >= 3).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length || !text) { frag.append(text || ""); return frag; }
  const re = new RegExp("\\b(" + words.join("|") + ")\\w*", "gi");
  let last = 0;
  for (const m of text.matchAll(re)) { frag.append(text.slice(last, m.index), el("mark", "", m[0])); last = m.index + m[0].length; }
  frag.append(text.slice(last));
  return frag;
}

/* ---------- Search ---------- */
function renderSearch(q) {
  setMeta((q ? q + " | " : "Search | ") + SITE, "Search GTA 6 guides, lists, tier rankings, news and articles on Beat Six.");
  const v = view();
  const [s, w] = pageHead("search", null, "Search", null);
  const bar = el("div", "sbar");
  bar.innerHTML = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  let t = null;
  const [form, inp] = searchForm("", q, (val) => {
    clearTimeout(t);
    t = setTimeout(() => { history.replaceState(null, "", "#search" + (val.trim() ? "?q=" + encodeURIComponent(val.trim()) : "")); drawHits(val); }, 120);
  });
  bar.append(form); w.append(bar);
  const chips = el("div", "chips"); chips.style.marginTop = "16px"; w.append(chips);
  v.append(s);
  const body = el("div", "wrap sres"), main = el("div"), side = el("aside", "side");
  body.append(main, side); v.append(body);

  function drawHits(val) {
    main.textContent = ""; chips.textContent = ""; side.textContent = "";
    const query = (val || "").trim();
    if (!query) {
      const e = el("div");
      e.append(el("h2", "", "Popular questions"));
      const ul = el("ul", "hits");
      ASKS.forEach(a => { const li = el("li", "hit"), h = el("h3"); h.append(link("#search?q=" + encodeURIComponent(a), "", a)); li.append(h); ul.append(li); });
      e.append(ul); main.append(e);
      side.append(el("h3", "", "Browse instead"));
      const outs = el("div", "outs");
      outs.append(link("#discover", "", "Lists of what to do next"), link("#meta", "", "Tier lists"), link("#news", "", "Latest news and tips"), link("#articles", "", "Articles"));
      side.append(outs);
      return;
    }
    const { terms, hits } = search(query);
    const counts = {}; hits.forEach(h => counts[h.d.kind] = (counts[h.d.kind] || 0) + 1);
    const mk = (k, label, n) => { const b = el("button", "chip", label); b.type = "button"; if (n != null) b.append(el("span", "n", String(n))); b.setAttribute("aria-pressed", String(searchKind === k)); b.onclick = () => { searchKind = k; drawHits(inp.value); }; return b; };
    if (hits.length) { chips.append(mk("all", "All", hits.length)); for (const k of Object.keys(KINDS)) if (counts[k]) chips.append(mk(k, KINDS[k], counts[k])); }
    if (searchKind !== "all" && !counts[searchKind]) searchKind = "all";
    const shown = hits.filter(h => searchKind === "all" || h.d.kind === searchKind).slice(0, 40);

    // Direct answer: a strong meta-item match shows its tier up top
    const top = hits[0];
    if (top && top.d.kind === "meta" && searchKind === "all") {
      const it = top.d.item, sc = combined(it), tile = el("div", "answer-tile");
      tile.append(tierBox(tierOf(sc), "sm"));
      const h = el("h3"); h.append(link(top.d.href, "", it.name)); tile.append(h);
      tile.append(el("p", "", [CATS[top.d.cat].tab, it.type, sc != null ? "score " + sc : null, it.get ? "get it: " + it.get : null].filter(Boolean).join(", ")));
      main.append(tile);
    }
    if (!shown.length) {
      const e = el("div", "empty");
      e.append(el("h3", "", "No Beat Six results for “" + query + "” yet"),
        el("p", "", "Try fewer words, or search the sources we pull from using the links on the right. New guides are added every evening."));
      main.append(e);
    } else {
      const ul = el("ul", "hits");
      for (const { d } of shown) {
        const li = el("li", "hit k-" + d.kind);
        li.append(el("span", "kind", KINDS[d.kind]));
        const h = el("h3"), a = d.external ? ext(d.href || "#", "") : link(d.href, "", "");
        a.append(highlight(d.title, terms)); h.append(a); li.append(h);
        if (d.snippet) { const p = el("p"); p.append(highlight(clip(d.snippet, 220), terms)); li.append(p); }
        if (d.where) li.append(el("div", "where", d.where));
        ul.append(li);
      }
      main.append(ul);
    }
    side.append(el("h3", "", "Search the sources directly"));
    const outs = el("div", "outs"), qq = encodeURIComponent("GTA 6 " + query);
    outs.append(
      ext("https://www.youtube.com/results?search_query=" + qq, "YouTube guides for “" + query + "”"),
      ext("https://www.reddit.com/r/GTA6/search/?q=" + encodeURIComponent(query), "Reddit r/GTA6 threads"),
      ext("https://www.google.com/search?q=" + qq, "Web results")
    );
    side.append(outs, renderAdSlot("rail"));
  }
  drawHits(q);
  if (!q) inp.focus();
  setLD([]);
}

}

/* ---------- Unlisted admin source importer (#sync) ---------- */
const GAMING_SAFETY_SETTINGS = [
  { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" },
  { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
  { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
  { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_ONLY_HIGH" }
];
async function callModelWithFallback(apiKey, parts, responseSchema) {
  let lastError = null;
  for (const modelId of MODEL_CANDIDATES) {
    try {
      const resp = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + modelId + ":generateContent?key=" + encodeURIComponent(apiKey), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts }], safetySettings: GAMING_SAFETY_SETTINGS, generationConfig: { responseMimeType: "application/json", responseSchema } })
      });
      const json = await resp.json();
      if (json.error) { lastError = new Error(json.error.message); continue; }
      const cand = json.candidates && json.candidates[0];
      if (!cand || !cand.content || !cand.content.parts || !cand.content.parts[0]) { lastError = new Error("Empty response from " + modelId); continue; }
      return JSON.parse(cand.content.parts[0].text);
    } catch (e) { lastError = e; }
  }
  throw lastError || new Error("All candidate models failed");
}
function renderSync() {
  setMeta("Source importer | " + SITE, "Internal tool.");
  const v = view();
  const [s] = pageHead("news", [["#", "Home"], "Source importer"], "Source importer", "Internal tool. Pulls creator and guide rankings with Gemini, merges them into the page, and exports data.json.");
  v.append(s);
  const body = el("div", "wrap sync-grid"), left = el("div", "box"), right = el("div", "box");
  left.append(el("h3", "", "Discover and merge rankings"));
  const fKey = el("div", "field"); const key = el("input"); key.type = "password"; key.placeholder = "AIzaSy…"; key.id = "gkey";
  fKey.append(el("label", "", "Google AI Studio key"), key);
  const fCat = el("div", "field"), sel = el("select"); sel.id = "gcat";
  const allOpt = el("option", "", "All four categories"); allOpt.value = "all"; sel.append(allOpt);
  for (const [k, c] of Object.entries(CATS)) { const o = el("option", "", c.title); o.value = k; sel.append(o); }
  fCat.append(el("label", "", "Scope"), sel);
  const row = el("div", "chips"), autoBtn = el("button", "btn", "Discover and merge"), dlBtn = el("button", "btn ghost", "Download data.json");
  row.append(autoBtn, dlBtn); left.append(fKey, fCat, row);
  right.append(el("h3", "", "Log"));
  const out = el("pre", "codeout", "Ready."); right.append(out);
  const itemRankSchema = { type: "OBJECT", properties: { items: { type: "ARRAY", items: { type: "OBJECT", properties: { itemName: { type: "STRING" }, itemType: { type: "STRING" }, whereToGet: { type: "STRING" }, blurb: { type: "STRING" }, sourceName: { type: "STRING" }, sourceUrl: { type: "STRING" }, kind: { type: "STRING" }, rank: { type: "INTEGER" }, timestamp: { type: "STRING" }, quote: { type: "STRING" } }, required: ["itemName", "sourceName", "rank", "quote"] } } } };
  autoBtn.onclick = async () => {
    const k = key.value.trim(), scope = sel.value;
    if (!k) { out.textContent = "Enter an API key first."; return; }
    const targets = scope === "all" ? Object.keys(CATS) : [scope];
    out.textContent = "Starting…";
    try {
      let merged = 0;
      for (const cKey of targets) {
        const current = (DATA.categories[cKey] || []).map(i => ({ id: i.id, name: i.name }));
        out.textContent += "\n[" + CATS[cKey].tab + "] fetching creator and guide consensus…";
        const parsed = await callModelWithFallback(k, [{ text: `Context: Benign software analysis of fictional video game item rankings in Grand Theft Auto VI for category "${cKey}". Known items: ${JSON.stringify(current)}. Return top ranked items, sourceName (real YouTube creators or guide sites), kind (youtube or web), rank, timestamp, and 1-sentence testing quote.` }], itemRankSchema);
        for (const hit of (parsed.items || [])) {
          const match = (DATA.categories[cKey] || []).find(i => i.name.toLowerCase().includes(hit.itemName.toLowerCase()) || hit.itemName.toLowerCase().includes(i.name.toLowerCase()));
          if (!match) continue;
          match.ranks = (match.ranks || []).filter(r => !/^Sample site/i.test(r.source || ""));
          match.ranks.unshift({ source: hit.sourceName, kind: hit.kind || "youtube", timestamp: hit.timestamp || "", quote: hit.quote, url: safeUrl(hit.sourceUrl), rank: hit.rank });
          merged++;
        }
      }
      DATA.meta.updated = new Date().toISOString().slice(0, 10);
      rebuild();
      out.textContent += "\n\nDone. Merged " + merged + " rankings.";
    } catch (err) { out.textContent += "\n\nError: " + err.message; }
  };
  dlBtn.onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" })); a.download = "data.json"; a.click(); };
  body.append(left, right); v.append(body);
}

/* ---------- Votes: this device, plus shared Supabase tally when reachable ---------- */
function rebuildTallyFromMyVotes() {
  if (sharedVotesActive) return;
  const t = {};
  for (const [k, val] of Object.entries(myVotes)) if (val === 1 || val === -1) t[k] = { up: val === 1 ? 1 : 0, n: 1 };
  tally = t;
}
async function fetchSharedVotes() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/item_votes?select=voter_id,item_id,vote", { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } });
    if (!r.ok) return;
    const rows = await r.json(), t = {};
    rows.forEach(row => {
      if (row.vote !== 1 && row.vote !== -1) return;
      t[row.item_id] = t[row.item_id] || { up: 0, n: 0 };
      t[row.item_id].n++; if (row.vote === 1) t[row.item_id].up++;
      if (row.voter_id === uid) myVotes[row.item_id] = row.vote;
    });
    tally = t; sharedVotesActive = true;
    if (DATA && /^meta|^$/.test(parseRoute().parts.join("/"))) render();
  } catch (e) {}
}
function startVotes() {
  uid = store.get("metacenter_voter_id", null);
  if (!uid) { uid = "v_" + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set("metacenter_voter_id", uid); }
  myVotes = store.get("metacenter_real_votes_v2", {});
  rebuildTallyFromMyVotes();
  fetchSharedVotes();
}
function castVote(id, val, redraw) {
  const prev = myVotes[id] || 0;
  if (myVotes[id] === val) delete myVotes[id]; else myVotes[id] = val;
  const cur = myVotes[id] || 0;
  if (sharedVotesActive) {
    tally[id] = tally[id] || { up: 0, n: 0 };
    if (prev) { tally[id].n = Math.max(0, tally[id].n - 1); if (prev === 1) tally[id].up = Math.max(0, tally[id].up - 1); }
    if (cur) { tally[id].n++; if (cur === 1) tally[id].up++; }
  } else rebuildTallyFromMyVotes();
  store.set("metacenter_real_votes_v2", myVotes);
  redraw();
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !uid) return;
  const h = { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY };
  const req = cur === 0
    ? fetch(SUPABASE_URL + "/rest/v1/item_votes?voter_id=eq." + encodeURIComponent(uid) + "&item_id=eq." + encodeURIComponent(id), { method: "DELETE", headers: h })
    : fetch(SUPABASE_URL + "/rest/v1/item_votes", { method: "POST", headers: { ...h, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" }, body: JSON.stringify({ voter_id: uid, item_id: id, vote: cur }) });
  req.catch(() => {});
}

/* ---------- Data cleanup ---------- */
// House style for pulled headlines: no semicolons or em/en dashes.
const headline = (t) => typeof t !== "string" ? t : t
  .replace(/\s*;\s*/g, ", ")
  .replace(/\s*[\u2014\u2013]\s*/g, ", ")
  .replace(/\s+--\s+/g, ", ")
  .replace(/,\s*,/g, ",").trim();
function clean(d) {
  for (const n of (d.news || [])) n.title = headline(n.title);
  for (const p of (d.posts || [])) { p.title = headline(p.title); p.dek = headline(p.dek); }
  for (const g of (d.guides || [])) { if (g) { g.title = headline(g.title); g.summary = headline(g.summary); } }
  for (const l of (d.lists || [])) { if (l) { l.title = headline(l.title); l.dek = headline(l.dek); (l.entries || []).forEach(e => { if (e) e.title = headline(e.title); }); } }
  // Drop placeholder sources instead of inventing new ones
  d.meta = d.meta || {}; d.categories = d.categories || {};
  for (const c of Object.keys(CATS)) d.categories[c] = d.categories[c] || [];
  for (const c of Object.keys(d.categories)) for (const it of d.categories[c]) {
    it.ranks = (it.ranks || []).filter(r => r && r.source && !/^Sample site/i.test(r.source));
    delete it.seedUp; delete it.seedVotes;
  }
  return d;
}

/* ---------- Routing ---------- */
function parseRoute() {
  const raw = location.hash.replace(/^#/, "");
  const [path, qs] = raw.split("?");
  return { parts: path.split("/").filter(Boolean).map(decodeURIComponent), q: new URLSearchParams(qs || "").get("q") || "" };
}
let lastPath = null;
function render() {
  if (!DATA) return;
  const { parts, q } = parseRoute(), [p0, p1, p2] = parts;
  const pillar = ({ search: "search", guide: "search", discover: "discover", list: "discover", meta: "meta", methodology: "meta", news: "news", articles: "news" })[p0] || (p0 && p0.startsWith("a-") ? "news" : CATS[p0] ? "meta" : "");
  document.querySelectorAll("#pillars a").forEach(a => a.dataset.p === pillar ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (CATS[p0]) return renderMeta(p0, p1);            // old #cars style links
  switch (p0) {
    case undefined: return renderHome();
    case "search": return renderSearch(q);
    case "discover": return renderDiscover();
    case "list": return renderList(p1);
    case "meta": return renderMeta(p1, p2);
    case "guide": return renderGuide(p1);
    case "news": return renderNews();
    case "articles": return renderArticles();
    case "methodology": return renderMethod();
    case "about": return renderAbout();
    case "sync": return renderSync();
    default: return p0.startsWith("a-") ? renderPost(p0.slice(2)) : renderHome();
  }
}
function onRoute() {
  const { parts } = parseRoute(), path = parts.slice(0, 2).join("/");
  render();
  if (path !== lastPath) { window.scrollTo(0, 0); lastPath = path; }
}
window.addEventListener("hashchange", onRoute);

/* Header search + "/" shortcut */
$("hsearch").addEventListener("submit", (e) => { e.preventDefault(); const q = $("hq").value; $("hq").value = ""; $("hq").blur(); go("search", q); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "/" || e.metaKey || e.ctrlKey || /input|textarea|select/i.test(document.activeElement.tagName)) return;
  e.preventDefault();
  const big = document.querySelector(".sbar input");
  (big || $("hq")).focus();
});

function rebuild() { LISTS = buildLists(); buildIndex(); render(); }
function boot(d) {
  DATA = clean(d);
  LISTS = buildLists(); buildIndex();
  onRoute();
}
startVotes();
fetch("data.json", { credentials: "same-origin" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(boot)
  .catch(() => boot({ meta: {}, categories: {}, news: [], posts: [], changelog: [] }));
</script>
