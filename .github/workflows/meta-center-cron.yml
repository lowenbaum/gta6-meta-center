name: Meta Center 5:52 PM Central Daily Refresh

on:
  schedule:
    - cron: '52 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify refresh script exists and passes syntax check
        run: |
          if [ ! -f scripts/daily-refresh.mjs ]; then
            echo "ERROR: scripts/daily-refresh.mjs not found."
            ls -la
            exit 1
          fi
          node -c scripts/daily-refresh.mjs

      - name: Run daily content aggregation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/daily-refresh.mjs

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json."
          else
            git commit -m "chore: daily Beat Six content refresh"
            git pull --rebase origin main
            git push origin main
          fi
