name: Meta Center 5:52 PM Central Daily Refresh

on:
  schedule:
    - cron: '52 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Beat Six Daily Refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/daily-refresh.mjs

      - name: Commit and push updated data.json
        run: |
          git config user.name "Beat Six Bot"
          git config user.email "bot@beatsix.local"
          git add data.json
          git diff --staged --quiet || (git commit -m "chore: daily content & news refresh" && git push)
